[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uthyagent-desktop"
version = "0.1.0"
description = "Local-first AI desktop automation for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "uthumany" }]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10"]
telegram = ["python-telegram-bot>=21,<23"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
uthyagent = "uthyagent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
